<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="160" viewBox="0 0 640 160">
  <style>
    .bg{fill:#ffffff}
    .card{fill:#f6f8fa;stroke:#d0d7df}
    .raw{fill:#0f62fe;font:700 12px/1 Arial, sans-serif}
    .caption{font:12px/1 Arial, sans-serif;fill:#111}
    .code{fill:#f3f6fb;stroke:#dbe7f5}
  </style>
  <rect width="640" height="160" fill="#fff"/>
  <g transform="translate(12,12)">
    <rect class="card" x="0" y="0" width="616" height="136" rx="8"/>
    <rect class="code" x="12" y="14" width="420" height="28" rx="4"/>
    <text x="22" y="34" class="caption">File: ver1-extract-journey.js</text>
    <!-- Raw button -->
    <rect x="460" y="16" width="110" height="28" rx="4" fill="#eaf2ff" stroke="#cfe0ff"/>
    <text x="502" y="34" class="raw">Raw</text>
    <text x="22" y="68" class="caption">Click <tspan font-weight="700">Raw</tspan> to open the plain file, then select all and copy.</text>
  </g>
</svg>
